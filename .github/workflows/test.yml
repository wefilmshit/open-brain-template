name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "26"
      - name: Test dashboard proxy
        run: npm test
      - name: Install memory-server dependencies
        run: npm ci
        working-directory: memory-server
      - name: Test memory-server
        run: npm test
        working-directory: memory-server

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.7.1
      - name: Test memory-api function
        run: deno test --allow-env --allow-read supabase/functions/memory-api/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test migrations and delete guard
        run: scripts/run-local-sql-test.sh supabase/migrations/0002_memory_delete_guard.sql tests/sql/memory_delete_guard.test.sql
      - name: Literal text search test
        run: scripts/run-local-sql-test.sh supabase/migrations/0002_memory_delete_guard.sql supabase/migrations/0003_literal_text_search.sql tests/sql/search_memories_text.test.sql
